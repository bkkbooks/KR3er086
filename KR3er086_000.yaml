body:
  text: 序欲治病者必先識病之名能識病名而後求其病之所由生知其所由生又當辨其生之因各不同而病狀所由異然後考其治之之法一病必有主方一方必有主藥或病名同而病因異或病因同而病症異則又各有主方各有主藥千變萬化之中實有一定不移之法即或有加減出入而紀律井然先聖後聖其揆一也自南陽夫子以後此道漸微六朝以降傳書絶少逮唐人外臺千金不過褒集古方未能原本內經精通病變然病名尚能確指藥味猶多精切自宋以還無非陰陽氣血寒熱補瀉諸膚廓籠統之談其一病之主方主藥茫然不曉亦間有分門立類先述病原後講治法其議論則雜亂無統其方藥則浮泛不經已如雲中望月霧裡看花倣佛想象而已至於近世則惟記通治之方數首藥名數十種以治萬病全不知病之各有定名方之各有法度藥之各有專能中無定見隨心所意姑且一試動輒誤人余深憫焉茲書之所由作也本內經以探其源次難經及金匱傷寒論以求其治其有未備者則取六朝唐人之方以廣其法自宋以後諸家及諸單方異訣擇其義有可推試多獲效者附焉庶幾古聖治病之法尚可復睹使學者有所持循不至倣徨無措至於推求原本仍當取內經金匱等全書潛心體認而後世之書亦當窮其流派掇其精華摘其謬誤而後此書之精意自能融會貫通而心有實獲則變化在我矣乾隆二十九年四月洄溪徐靈胎書於吳山之半松書屋
