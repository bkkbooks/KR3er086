body:
  text: 卷八婦人素問六元正紀大論黃帝問曰婦人重身毒之何如岐伯曰有故無殞亦無殞也帝曰願聞其故岐伯曰大積大聚其可犯也衰其大半而止過者死腹中論帝曰何以知懷子之且生也岐伯曰身有病而無邪脈也奇病論黃帝問曰人有重身九月而喑此何為也岐伯曰胞之絡脈絶也帝曰何以言之岐伯曰胞絡者繫於腎少陰之脈貫腎系舌本故不能言帝曰治之奈何岐伯曰無治也當十月復平人氣象論婦人手少陰脈動甚者妊子也難經妊之為病其內苦結女子為瘕聚左者為腎右者為命門命門者諸精神之所舍原氣之所繫也男子以藏精女子以系胞金匱問曰新産婦人有三病一者病痙二者病鬱冒三者大便難何謂也曰新産血虛多汗出喜中風故令病痙亡血復汗寒多故多鬱冒亡津液胃燥故大便難産婦鬱冒其脈微弱嘔不能食大便反堅但頭汗出所以然者血虛而厥厥而必冒冒家欲解必大汗出以血虛下厥孤陽上出故頭汗出所以産婦喜汗出者亡陰血虛陽氣獨盛故當汗出陰陽乃復大便堅嘔不能食小柴胡湯主之雖當汗出不宜太過師曰産婦腹痛法當以枳實芍藥散假令不愈者此為腹中有瘀血著臍下宜下瘀血湯主之亦主經水不利産後七八日無太陽證少腹堅痛此惡露不盡不大便煩躁發熱切脈微實再倍發熱日晡時煩躁者不食食則譫語至夜即愈宜大承氣湯主之熱在裡結在膀胱也婦人傷寒發熱經水適來晝日明瞭暮則譫語如見鬼狀者此為熱入血室治之無犯胃氣及上二焦必自愈婦人中風發熱惡寒經水適來得七八日熱除脈遲身涼和胸脅滿如結胸狀譫語者此為熱入血室也當刺期門隨其實而取之期門二穴在乳頭直下四寸第二肋端此等刺法最易學也婦人之病因虛積冷結氣為諸經水斷絶至有歷年血寒積結胞門寒傷經絡凝堅在上嘔吐涎唾久成肺癰形體損分在中盤結繞臍寒疝或兩脅疼痛與臟相連或結熱中痛在關元脈數無瘡肌若魚鱗時著男子非止女身在下未多經候不勻令陰掣痛少腹惡寒或引腰脊下根氣衝氣衝急痛膝脛疼煩奄忽眩冒狀如厥癲或有憂慘悲傷多嗔此皆帶下非有鬼神久則羸瘦脈虛多寒三十六病千變萬端審脈陰陽虛實緊弦行其針藥治危得安其雖同病脈各異源子當辨記勿謂不然問曰婦人年五十所病下利數十日不止暮即發熱小腹裡急腹滿手掌煩熱唇口乾燥何也師曰此病屬帶下何以故曾經半産瘀血在少腹不去何以知之其證唇口乾燥故知之當以溫經湯主之婦人陷經漏下黑不解膠薑湯主之方無考校本云宜是膠艾湯婦人懷娠六七月脈弦發熱其胎愈脹腹痛惡寒者少腹如扇形容惡寒之盛所以然者子臟開故也當附子湯溫之方無考婦人傷胎懷身腹滿不得小便從腰以下重如有水氣狀懷身七月太陰當養不養此心氣實當刺瀉勞宮關元小便微利則愈病源妊娠數墮胎候血氣虛損子臟為風冷所居則血氣不足故不能養胎所以致胎數墮候妊娠而恆腰痛者喜墮胎也按墮胎皆由於血熱兩胎一死一生候陽施陰化精盛有餘者則成兩胎其兩胎而一死者候其胎上冷是胎已死也妊娠過年不産由挾寒冷宿血在胞而有胎則冷血相搏令胎不長産不以時若其胎在胞日月雖多其胎翳小轉動勞羸是挾於病必過時乃産胞轉臍下急痛小便不通是也其病由不同胞轉及胞落並致死帶下三十六疾諸方説三十六疾者是十二癥九痛七害五傷三固是也十二癥者是所下之物一如膏二如青血三如紫汁四如赤皮五如膿痂六如豆汁七如葵根羹八如凝血九如青血血似水十如米汁十一如月浣十二經度不應期也九痛者一陰中傷痛二陰中淋痛三小便即痛四寒冷痛五月水來腹痛六氣滿並痛七汁出陰中如蟲齧痛八脅下皮痛九腰痛七害者一害食二害氣三害冷四害勞五害房六害妊七害睡五傷者一窮孔痛二中寒熱痛三小腹急牢痛四臟不仁五子門不正引腎痛三固者一月水閉塞不通其餘二固文缺不載與鬼交臟腑虛神守弱鬼氣得病之也其狀不欲見人獨言笑悲泣脈來遲伏或如鳥啄惡阻心中潰悶頭眩四肢煩疼懈惰不欲執作惡聞食氣欲啖食鹹酸果食多睡少起乃至三四月以上大劇者不能自勝舉也此由婦人元本虛羸血氣不足腎氣又弱兼當風食冷太過心下有痰氣挾之而有妊也子滿此由脾胃虛弱有停水而挾以妊娠也水漬於胞則令胎壞惟將産之月而腳微腫則其産易蓋胞藏水血多也初妊娠者則反壞胎胎漏此由衝任脈虛不能約制太陽少陰之經血也亦名胞阻漏血盡則人斃也鬼胎正虛則妖魅精入臟狀如懷娠胎疸其母臟氣熱熏蒸於胎血分是經血先斷而後成水病以其月水壅塞不通經血分而為水故曰血分胞絡傷損子臟虛冷氣下衝則陰挺出謂之下脫亦有因産用力偃氣而陰脫者陰臭由子臟有寒寒搏於津液蘊積氣衝於陰故變臭也此亦由內熱所致子臟開由子臟宿虛因産冷氣乘之血氣得冷不得相榮故令開也婦人方桂枝茯苓圓金匱治婦人宿有癥病經斷未及三月而得漏下不止胎動在臍上者為癥痼害妊娠六月動者前三月經水利時胎也下血者後斷三月衃也所以血不止者其癥不去故也當下其癥此主之桂枝丹皮茯苓桃仁去皮尖熬芍藥各等分上五味末之煉蜜丸如兔屎大每日食前服一丸不知加至三丸當歸芍藥散金匱治婦人懷娠腹中㽱痛當歸三兩芍藥一斤茯苓四兩白朮四兩澤瀉半斤芎藭三兩上杵為散取方寸匕酒和日三服乾薑人參半夏丸金匱治妊娠嘔吐不止乾薑人參各一兩半夏二兩上三味末之生薑汁糊丸如梧子大飲服十丸日三葵子茯苓散金匱治妊娠有水氣身重小便不利灑淅惡寒起即頭眩葵子一斤茯苓三兩上二味杵為散飲服方寸匕日三服小便利則愈當歸貝母苦參丸金匱治妊娠小便難飲食如故當歸貝母苦參各等分上三味末之蜜丸如小豆大飲服三丸加至十丸當歸散金匱婦人妊娠宜常服當歸黃芩芍藥芎藭各一斤白朮半斤上五味杵為散酒服方寸匕日再服妊娠常服即易産胎無苦疾産後百病悉主之白朮散金匱妊娠養胎白朮芎藭蜀椒三分去汗牡蠣上四味杵為散酒服一錢匕日三服夜一服但苦痛加芍藥心下毒痛倍加芎藭心煩吐痛不能飲食加細辛一兩半夏大者二十枚服之後更以酸漿水服之若嘔以醋漿水服復不解者小麥汁服之以後渴者大麥粥服之病雖愈服之勿置原本無分兩枳實芍藥散金匱治産後腹痛煩滿不得臥枳實燒令黑勿太過芍藥等分上二味杵為散服方寸匕日三服並主癰膿以麥粥下之假令腹痛不愈此為腹中有瘀血著臍下宜下瘀血湯主之亦主經水不利下瘀血湯金匱大黃三兩桃仁二十枚蟅蟲二十枚去足熬末之蜜和為四丸以酒一升煎一丸取八合頓服之新血下如豚肝以丸作煎又一法按新字當作瘀字竹葉湯金匱治産後中風發熱面正赤喘而頭痛竹葉一把葛根三兩防風桂枝桔梗人參甘草各一兩附子一枚泡大棗十五枚生薑五兩上十味水一斗煮取二升半分溫三服溫覆取汗出頸項強用大附子一枚破之如豆入前藥揚去沫嘔者加半夏半升洗竹皮大丸金匱治婦人乳中虛煩亂嘔逆安中益氣生竹茹二分石膏二分桂枝一分甘草七分白薇一分上五味末之棗肉丸如彈子大飲服一丸日三夜二有熱倍白薇煩喘者加柏實一分白頭翁加甘草阿膠湯金匱治産後下痢虛極白頭翁甘草阿膠各二兩秦皮三兩黃連二兩柏皮三兩上六味水七升煮二升半納膠令消分溫三服半夏厚朴湯金匱治婦人咽中如有炙臠半夏一升厚朴三兩茯苓四兩生薑五兩干蘇葉二兩上五味水七升煮取四升分溫四服日三夜一甘麥大棗湯金匱治婦人臟燥悲傷欲哭象如神靈所作數欠伸此主之甘草三兩小麥一升大棗十枚上三味水六升煮取三升分溫三服亦補脾氣溫經湯金匱主婦人曾經半産瘀血在少腹不去其證唇口乾燥吳茱萸三兩當歸二兩芎藭二兩芍藥二兩人參二兩桂枝二兩阿膠二兩丹皮二兩生薑三兩甘草二兩半夏一升麥冬一升去心水一斗煮取三升分溫三服亦主婦人少腹寒久不受胎兼治崩中去血或月水來過多及至期不來調經總方土瓜根散金匱治帶下經水不利少腹滿痛經一月再見土瓜根芍藥桂枝蟅蟲各三兩上四味杵為散酒服方寸匕日三服此治瘀血伏留在衝脈之方旋覆花湯金匱寸口脈弦而大弦則為減大則為芤減則為寒芤則為虛寒虛相搏此名曰革婦人則半産漏下此湯主之旋覆花三兩蔥十四莖新絳少許水三升煮取一升頓服大黃甘遂湯金匱治婦人少腹滿如敦狀小便微難而不渴此為水與血俱結在血室也此主之大黃四兩甘遂二兩阿膠二兩上三味以水三升煮取一升頓服其血當下礬石丸金匱治經水閉不利臟堅癖不止中有乾血下白物礬石三分燒杏仁一分上二味末之煉蜜丸棗核大納臟中劇者再納之紅藍花酒金匱治婦人六十二種風腹中血氣刺痛紅藍花一兩酒一大升煎減半頓服一半未止再服蛇床子散金匱治婦人陰寒溫陰中坐藥蛇床子一味末之以白粉少許和合相得如棗大綿裹納之自然溫狼牙湯金匱治婦人陰中生瘡蝕爛者狼牙三兩水四升煮取半升以綿纏箸如繭絞湯瀝陰中日四遍三物黃芩湯千金治婦人在草蓐自發露得風四肢苦煩熱頭痛者與小柴胡湯頭不痛但煩者此湯主之黃芩一兩苦參二兩地黃四兩上三味水六升煮取二升溫服一升多吐下蟲當歸建中湯千金治産後虛羸不足腹中刺痛不止吸吸少氣或苦少腹中急掣痛引腰背不能食飲産後一月日得服四五劑為善令人強壯宜當歸四兩桂枝三兩芍藥六兩生薑三兩甘草二兩大棗十二枚上六味水一斗煮取三升分溫三服一日令盡若大虛者加飴糖六兩湯成納之火上暖令飴消若去血過多崩傷內衄不止加地黃六兩阿膠二兩佛手散本事方又名芎歸湯調經芎藭二兩當歸三兩上為細末每服二錢水一盞酒二分煎七分溫服回生丹此催生之聖藥錦紋大黃一斤為末蘇木三兩打碎用河水五碗煎汁三碗聽用大黑豆三升水浸取殼用絹袋盛殼同豆煮熟去豆不用將殼曬乾其汁留用紅花三兩炒黃色入好酒三四碗煎三滾去渣取汁米醋九斤陳者更佳將大黃末入淨鍋下米醋三斤文火熬之以長木箸不住手攪之成膏再加醋三斤熬之又加醋三斤次第加畢然後下黑豆汁三碗再熬次下蘇木汁次下紅花汁熬成大黃膏取入瓦盆盛之大黃鍋粑亦剷下入後藥同磨人參當歸酒洗芎藭香附醋炒延胡索酒炒蒼朮米泔浸炒蒲黃隔紙炒茯苓桃仁各一兩去皮尖油牛膝五錢酒洗甘草炙地榆酒洗川羌活橘紅白芍各五錢酒炒木瓜青皮各三錢去瓤炒乳香沒藥各二錢益母草三兩木香四錢白朮三錢米泔浸炒烏藥二兩五錢去皮良薑四錢馬鞭草五錢秋葵子三錢熟地一兩酒浸九次蒸曬如法制就山稜五錢醋浸透紙裹煨五靈脂五錢醋煮化焙乾細研山萸肉五錢酒浸蒸搗上三十味並前黑豆殼共曬為末入石臼內大黃膏拌勻再下熟蜜一斤共搗千杵為丸重二錢七八分陰乾不可火烘爍蠟為殼護之用時去蠟開骨散臨産婦交骨不開當歸五錢龜板三錢醋炙研芎藭二錢婦人發一團水煎服奪命散産後沒藥血竭等分上研為細末才産下用童便細酒半杯煎一二沸調下二錢良久再服其惡血下行便不衝上免生百疾下死胎方本事方桂木三錢麝香當門子一粒同研溫酒服須臾如手推下比之用水銀等藥此不致損元氣也交加散本事方治婦人榮衛不通經脈不調腹中撮痛氣多血少結聚為瘕産後中風生地黃五兩研取汁生薑五兩研取汁上交互用汁浸一夕各炒黃漬汁盡為度末之尋常腹痛酒調下三錢尤不可缺護胎方本事方治妊娠時氣身熱令子不落伏龍肝為末水調塗臍下二寸干則易瘥即止又取井中泥塗心下干則易海蛤散本事方治婦人傷寒血結胸膈揉而痛不可撫近海蛤滑石甘草各一兩芒硝半兩上為末每服二錢雞子清調下小柴胡加地黃湯本事方治婦人室女傷寒發熱或發寒熱經水適來或適斷晝則明瞭夜則譫語如見鬼狀亦治産後惡露方來忽爾斷絶柴胡一兩一分人參黃芩甘草生地黃各半兩上為末每用五錢水二盞生薑五片棗二枚煎至八分去渣服此即熱入血室烏雞煎圓局方治婦人胎前産後諸般疾患並皆治之烏雄雞一隻人參白朮石床丹皮黃耆烏藥草果延胡索地黃熟乾者洗焙木香琥珀肉豆蔻各半兩陳皮紅花川烏泡海桐皮芍藥白者附子泡去皮臍肉桂去粗皮蓬莪朮各三兩蒼朮米泔浸切焙一兩半上細銼用烏雄雞一隻湯撏去毛及腸肚將上藥安放雞腹中用新瓦瓶好酒一斗同煮令乾去雞骨以油單紙盛焙乾為細末煉蜜丸如梧子大每服三十丸豬蹄湯局方治乳婦氣少血衰脈澀不行絶無乳汁豬蹄一隻木通五兩上將豬蹄淨洗依食法事治次用水一斗同木通浸煮得四五升取汁飲如乳不下再服為妙紫石英丸局方治婦人久冷無子及數經墮胎經水不調崩漏帶下三十六病積聚癥瘕少腹急重小便白濁烏賊魚骨燒灰甘草炙柏子仁微炒別研山蕷各一兩半辛荑仁肉桂去粗皮卷柏石斛干熟地黃芎藭牡蒙禹餘糧醋淬七次研各二兩人參續斷細辛桑寄生牛膝厚朴薑汁炙吳茱萸當歸炒川烏泡去皮臍乾薑泡丹皮各一兩一分天門冬去心紫石英細研飛各三兩上為細末煉蜜丸如梧子大每服三十丸溫酒或米飲下空心食前日二服催生丹局方治産婦産育艱難或逆或橫並宜服之母丁香末一錢麝香別研一錢兔腦髓臘月者去皮搗如泥乳香別研極細一分上拌勻以兔腦和圓如雞豆大陰乾用油紙蜜封貼溫水服一丸即時産下隨男左女右手握丸藥出是驗小調經散局方治産後敗血循經流入四肢腐爛如水服此血行腫消則愈沒藥琥珀桂心白芍當歸各一錢細辛麝香各五分為末薑汁酒各少許調服此方治血分病最良二味參蘇飲治産後瘀血入肺咳嗽喘急人參一兩紫蘇二兩疑是蘇木作一劑水煎服若既愈當用六君子湯以補脾胃若口鼻黑氣起急用此藥加附子五錢亦有得生者紫蘇飲嚴氏治子懸腹痛或臨産驚恐氣結連日不安或大小便不利當歸甘草大腹皮黑豆浸水泡人參芎藭橘皮各七分白芍炒五分紫蘇一錢薑蔥引水煎服紫散元和紀用經止血崩香附子炒黑存性為末熱酒調方寸匕再服立定生末安胎秦桂丸雜抄方治婦人無子秦艽桂心杜仲防風厚朴各三錢附子生用茯苓各一兩五錢白薇乾薑沙參牛膝半夏各五錢人參一兩細辛一兩一錢上十四味為末煉蜜丸如緑豆大每服三十丸空心米飲任下未效再加數丸已覺有孕便不可服求嗣方雜抄方壬子日合藥別日不用名助陽丹細辛五錢牛膝二兩茯苓一兩沒藥四錢吳茱萸白蘞白及秦艽乳香防風當歸去蘆各三錢肉桂厚朴石菖蒲附子各二錢人參一錢以上二方治胞寒無子者陰虛血少者非宜黃龍湯活人書妊娠寒熱頭疼默默不欲飲食脅下痛嘔逆痰氣及産後傷風熱入胞宮寒熱如瘧並經水適斷病後勞復餘熱不解柴胡一兩黃芩人參甘草各一分半炙上四味每服五錢水一盞半煎一盞去渣溫服桂枝湯金匱婦人得平脈陰脈小弱其人渴不能食無寒熱名妊娠桂枝湯主之於法六十日當有此證設有醫治逆者卻一月加吐下者則絶之見傷寒小柴胡湯金匱婦人中風七八日續來寒熱發作有時經水適斷此為熱入血室其血必結故使如瘧狀見傷寒大承氣湯金匱産後七八日無太陽症少腹堅痛惡露不盡不大便煩躁發熱切脈微實再倍發熱日晡時煩躁者不食食即譫語至夜即愈熱在裡結在膀胱也見傷寒小青龍湯金匱婦人吐涎沫醫反下之心下即痞當先治其吐涎沫此主之見痰飲涎沫止乃治痞瀉心湯主之見血門芎歸膠艾湯金匱治陷經漏下黑不解見通治豬發膏煎金匱胃氣下泄陰吹而正喧此穀氣之實也見疸門腎氣丸金匱治婦人飲食如故煩熱不得臥而反倚息者此名轉胞不得溺也以胞系了戾故致此病但利小便則愈即崔氏八味丸見通治當歸生薑羊肉湯金匱治産後腹中㽱痛並治腹中寒疝虛勞不足見通治按婦人一切外感內傷等症與男子同無庸另立治法惟經帶胎産鷖瘕等疾病變多端必從調經種子等法探本索源而後可施用今因金匱要略有治婦人方論一卷故亦略載婦人常用之方數十首至其全體仍當取唐宋以來專門之書詳考之小兒此卷方論俱從錢氏直訣選出其外有小兒常患之症而方未備者更考他書補入治小兒之法大端略具其所選之方藥一概全録不必更將他卷查閲以便業幼科者專取此書誦習可也脈法脈弦急氣不和脈沉緩傷食脈促結虛驚脈浮為風脈沉細為寒脈亂不治全幼心鑑云小兒一歲以前看虎口食指寅卯辰三關以驗其病寅卯辰即風氣命三關也脈紋從寅關起不至卯關者易治若連卯關者難治若寅侵卯卯侵過辰者十不救一其脈紋見有五色如因驚必青瀉痢必紫當以類而推之一歲後則可用一指轉側辨其三部脈弦急浮沉四五歲後脈七八至而細數者為平九至者傷十至者困六至五至者為虛為寒弦緊為風癇弦急為客忤面部症左腮為肝右腮為肺額上為心鼻為脾頦為腎若色赤者熱也宜隨症治之目部症目內色赤者心實熱淡紅者心虛熱青者肝實熱淡青者肝虛熱黃者脾實熱微黃者脾虛熱白而混者肺實熱目無睛光者腎虛也五臟虛實寒熱心主驚實則叫哭發熱飲水而搐虛則臥而悸動不安視其睡口中氣溫或合面睡及上竄咬牙皆心熱也心氣實則喜仰臥肝主風實則目直大叫呵欠項急頓悶虛則咬牙多欠肝熱則手尋衣領及亂捻物壯熱飲水喘悶目赤發揚肝有風則目連札得心熱則發搐或筋脈牽繫而直視風甚則身反張強直不搐心不受熱也當補腎治肝脾主困實則困睡身熱飲水虛則吐瀉生風面白腹痛口中氣冷不思飲食或吐清水呵欠多睡者脾氣虛而欲發驚也肺主喘實則悶亂喘促有飲水者有不飲水者虛則哽氣長出氣肺熱則手掐眉目鼻面肺盛復感風寒則胸滿氣急喘嗽上氣肺臟怯則唇白悶亂氣粗喘促哽氣者難治肺虛甚也腎主虛無實也惟瘡疹腎實則變黑陷若胎稟虛怯神氣不足目無睛光面白顱解此皆難育雖育不壽或更加色欲變症百出愈難救療或目畏明下竄者蓋骨重而身縮也咬牙者腎水虛而不能制心火也變蒸小兒在母腹中乃生骨氣五臟六腑成而未全自生之後即長骨脈五臟六腑之神智也變者易也自內而長自下而上又身熱故已生之日後三十二日一變變每畢即情性有異於前何者長生腑臟智意故也何為三十二日長骨添精神人有三百六十五骨除手足中四十五碎骨外有三百二十自生下骨一日十段而上之十日百段三十二日計三百二十段為一遍亦曰一蒸骨之餘氣自腦分入齦中作三十二齒而齒牙有不及三十二數者由變不足其常也或二十八日即至長二十八齒以下仿此但不過三十二之數也凡一周遍乃發虛熱諸病如是十周則小蒸畢也計三百二十日生骨氣乃全而未壯也急驚風症治小兒急驚因聞大聲或驚而發搐搐正如故此熱生於心身熱面赤引飲口中氣熱二便黃赤甚則發搐蓋熱甚生風陽盛而陰虛也宜利驚丸除其痰熱不可用巴豆之藥慢驚風症治小兒慢驚因病後或吐瀉或藥餌傷損脾胃而肢體逆冷口鼻氣微手足瘛瘲昏睡露睛此脾虛生風無陽之症也小兒初生壯熱吐哯身體強直手足抽掣目反直視是胎驚風症也發搐症治驚癇發搐男則目左視無聲右視有聲女則右視無聲左視有聲相勝故也欲驗逆順男則握拳拇指叉入食指中為順於外為逆女則叉入食指為逆於外為順仍參吮乳不能類以治其母後仿此若傷風發搐口中氣熱呵欠頓悶手足動搖若傷食發搐身溫多睡或吐不思食百日內發搐真者不過二三次必死假者頻發不死真者內生驚癇假者外傷風冷血氣未實不能勝任故發搐癲癇症治凡治五癇皆隨臟治之每臟各有一獸之形並用五色丸治之發而重者死病甚者亦死若反折上竄其聲如犬症屬肝也若目瞪吐舌其聲如羊症屬心也若目直腹痛其聲如牛症屬脾也若驚跳反折手縱其聲如雞症屬肺也若肢體如尸口吐涎沫其聲如豬症屬腎也小兒半歲之間有病以名中食三指曲按額前眉上髮際之下若三指俱熱感受風邪鼻塞氣粗三指俱冷感受風寒臟冷吐瀉若食中二指熱上熱下冷名中二指熱夾驚之候食指熱胸膈氣滿乳食不消水鏡訣云陰陽運合男女成形已分九竅四肢乃生五臟六腑部位各分逆順難明若憑寸口之浮沉必至橫亡於孩子須明虎口辨別三關消詳用藥必無差誤未至三歲看虎口三關若脈見風關尚易治交氣關則難治交命關為死症又當辨其色如獸驚三關必青水驚三關必赤人驚三關必黑若紫色主瀉痢黃色是雷驚三關脈通度乃極驚之症必死有紋或青或紅如線直者是母食傷脾左右一樣者是驚積齊發紋有三條白主肺傷風痰或齁䶎聲青主傷寒及嗽紅主泄瀉有黑相兼主下痢紅多白痢黑多赤痢有紫相兼虎口脈亂乃氣不和也蓋脈紋見有五色由其病甚色能加變即至純黑者不可得而治矣五臟瘡疹症治小兒在胎食五臟血穢伏於命門若遇天行時熱或乳食所傷或驚恐所觸則其毒當出初起之候面燥腮赤目胞亦赤呵欠頓悶乍涼乍熱咳嗽嚏噴手足梢冷驚悸多睡宜究其何臟所發察其何因所起令乳母亦須節飲食慎風寒五臟各有一症肝臟水疱青色而小肺臟膿疱色白而大心臟斑色赤而小脾臟疹小次斑故色赤黃淺也先發膿疱後發疹子者順先疹子後斑者順反此為逆惟腎無候但見骫冷耳冷是也若寒水來侮故黑陷而耳骫反熱為逆也急用百祥丸牛李膏各三服不愈者死如發潮熱三日以上出不甚多而熱不止者未盡也潮熱隨出如早食潮熱不已為水泡之類也一發便出盡者重瘡夾疹者半輕半重也出稀者輕裡外微紅者輕外黑裡赤者微重外白里黑者大重也瘡端里黑點如針孔者勢最劇也青乾紫陷昏睡汗出煩躁熱滑腹脹啼喘二便不通者困也有大熱利小便解熱毒若紫黑干陷或寒戰咬牙或身黃腫紫者急以百祥丸下之復惡寒不已身冷出汗耳骫反熱者死症也此腎氣大旺脾虛不能制故耳下後身熱氣溫飲水者可治以脾土勝腎寒去而溫熱也不黑者不可下下則內虛歸腎大抵瘡疹屬陽在春夏為順秋冬為逆冬月腎旺盛寒病多歸腎變黑又當辨春膿疱夏黑陷秋斑子冬疹子者十活四五黑者十難救一身熱煩渴腹滿而喘便澀面赤悶亂大吐此當利小便不瘥者宣風散下之若能食而痂頭焦起或未焦而喘實亦可下之若五七日痂不焦是內熱也宣風散導之生犀汁解之斑疹作搐為脾虛而肝則乘心火妄動風熱相搏也當瀉心肝補脾土瘡黑而忽便膿血並痂皮者乃脾氣實腎邪退而病安也及瀉而乳食不化者脾虛不能制腎故為難治此即近世痘瘡之症其病與斑疹同列並無起脹成漿收靨等説大抵宋時之瘡形治法不過如此近日愈變愈重與斑疹絶不相類治亦迥別因知天下之病隨時隨地變化無窮所以內經有五運六氣異法方宜等論為醫者苟不能知天運之轉移及五方之體性終有偏執之處不可以稱上工也痘瘡無人可免自種痘之法起而小兒方有避險之路此天意好生有神人出焉造良法以救人也然人往往以種痘仍有死者疑而不敢種不知乃苗之不善非法之不善也況即有死者不過百中之一較之天行惡痘十死八九者其安危相去何如也至於治痘之書自宋至今不下數十種莫不和平切近孰意邇年以來崇奉怪書不論小兒之強弱痘症之虛實慨以大黃數兩石膏數斤為一劑使兒真火消盡元氣大傷絶其起脹成漿之路因向其父母云此症或不能起脹或不能成漿而死至期果死其父母以為神目不知此實醫者致之死地也或幸不死則信為大黃石膏之功而此二味遂為不祧之藥矣又方中多用蜂房蠍子蠐螬蚯蚓蚌汁等惡物成升成碗灌入兒腹以增其毒而爛其胃宛轉就死尤可痛心夫近日時醫治精壯男婦之病見用清火之藥一二錢群以為此寒涼之品斷不可服必當用附桂參術獨於數月之小兒反用大寒大毒之藥成兩成斤俾死者接踵而不悔何耶醫者不足責為父母而目睹其子之服此毒藥以致慘死毫無疑怨則何心也丹瘤丹瘤之症因熱毒客於腠理搏於血氣發於皮膚當以白玉散塗之傷風兼變症治二傷風兼肝則發搐頓悶兼心則驚不安兼肺則喘嗽哽氣兼脾則困睡兼腎則目畏明各隨補其母諸經發熱症治三潮熱者時間發熱過時即退來日依時而發此欲發驚也壯熱者常熱不已甚則發驚癇也風熱者身熱而口中氣熱乃風邪外感也溫熱者肢體微熱也發熱而不欲飲水者胃氣虛熱也發熱而飲水作渴喜冷飲食者胃氣實熱也吐瀉症治若吐乳瀉黃傷熱乳也吐乳瀉青傷冷乳也皆當下之吐瀉昏倦睡不露睛者胃實熱也吐痰涎及緑水者胃虛冷也初生下吐因穢惡下咽故也凡初生急須拭淨口中否則啼聲一發穢物咽下致生諸病拭去穢物出痘必稀五臟內外疳症主治凡小兒疳在內目腫腹脹瀉痢青白體瘦羸弱疳在外鼻下赤爛頻揉鼻耳或肢體生瘡鼻瘡用蘭香散諸瘡用白粉散肝疳一名筋疳白膜遮睛或瀉血面瘦心疳面黃頰赤身體壯熱脾疳一名肥疳體黃瘦削皮膚乾澀而有瘡疥腹大嗜土腎疳一名骨疳肢體瘦削遍生瘡疥喜臥濕地肺疳一名氣疳喘嗽氣促口鼻生瘡若患潮熱當先補肝後瀉心若妄以硝黃諸藥利之若患癖當消磨若誤以巴豆硼砂下之及傷寒誤下皆能成疳其初病者為熱疳久病者為冷疳冷熱相兼者津液短少者皆因大病脾胃虧損內亡津液所致當固脾胃為主早為施治則不變敗症也腹痛腫脹諸症小兒腹痛體瘦面色㿠白目無睛光口中氣冷不思飲食或嘔利撮口此脾土虛而寒水所侮也若口中氣溫面色黃白目無睛光或多睡惡食或大便酸臭此積病也若腹脹而悶亂喘滿者實也若不悶亂喘滿者脾虛也誤下之以致目泡腮面四肢浮腫肚腹愈脹因下而喘脾氣益虛也脾虛不能勝腎水隨肺氣行於四肢如水狀若侵浮於肺即大喘也若腎熱傳於膀胱熱甚逆於脾肺脾胃虛而不能制腎水流走四肢而身面皆腫若土勝則刑于肺故令喘也若口吐涎沫或吐清水面㿠白心腹痛有時者蟲痛也與癇相似但目不斜手不搐也安蟲散主之若腹中有癖不食但飲乳是也蓋小兒病此良由乳食不消伏於腹中乍冷乍熱飲水過多即蕩滌腸胃亡失津液脾胃虛弱不能傳化水穀以致四肢羸瘦肚腹漸大而成疳矣五臟雜症主治喜汗者厚衣臥而額汗出也盜汗者肌肉虛而睡中汗出也胃虛汗者上至項下至臍也六陽虛汗者上至頭下至項難治夜啼者小兒筋骨血脈未成而多哭脾臟冷而痛也當與溫中藥或花火膏主之若虛怯為冷所乘則唇青驚啼者邪氣乘心也當以安神丸主之若浴後拭臍不幹風入作瘡令兒撮口甚者是脾虛也若頻撮口是氣不和也弄舌熱者脾臟微熱令舌絡牽緊時時舒熱或飲水者脾胃虛而津液少也兼面黃肌瘦五心煩熱者疳積也大病未已而弄舌者凶解顱者生下囟門不合也長必多愁少笑目白精多面色㿠白或體消瘦皆腎虛也胎肥者生下豐厚目睛粉紅大便乾難時出涎水胎熱者生下有血色時叫哭身熱淡黃目睛多赤大便色黃急欲食乳並用浴體法主之胎怯者生下面白肌肉瘦弱大便白水身無血色硬氣多噦亦用浴體法急欲乳不能食者此風邪由臍而蘊熱心脾致舌厚唇燥不能吮乳也龜胸龜背者由兒生下風客於脊入於骨髓致成龜背若肺熱脹滿攻於胸膈即成龜胸並用龜尿點其骨節自愈取尿法用青蓮葉安龜在上用鏡照之其尿自出失音吐瀉或大便後雖有聲而不能言又能咽物者非失音此腎怯不能上接於陽也凡口噤不止則失音語遲若大病後身目皆黃者黃病也身病背強大小便澀一身盡黃小便黃赤此黃疸也瀉者難治若百日或半年不因病而身黃者胃熱胎疸也若淡黃兼白者胃怯也長大不行行則腳軟齒久不生生則不固發久不生生則不黑皆胎弱小兒方瀉青丸治肝經實熱急驚搐搦羌活壬乙同歸一治故用羌活大黃瀉諸實熱芎藭入手足厥陰辛以緩肝山梔仁瀉心火實則瀉其子龍膽草炒益肝膽氣止驚當歸入足厥陰以其同藏血也防風各等分上為末煉蜜丸芡實大每服半丸竹葉湯入砂糖化下導赤散治小腸實熱小便祕赤生地黃心與小腸之藥木通利小腸之熱故錢氏用以導赤甘草生瀉心火各等分上為末每服一錢入淡竹葉涼心經水煎生犀散治心經虛熱地骨皮赤芍藥柴胡乾葛各一兩甘草五錢犀角二錢鎊主風熱驚癇鎮肝除心熱丹溪云犀角痘後用以散餘毒無毒而血虛者非宜上為末每服一二錢水煎瀉黃散治脾胃實熱藿香葉入手足太陰經助脾開胃止嘔甘草各七錢五分石膏五錢瀉胃火山梔仁一兩治胃中熱氣防風三兩上用蜜酒微炒為末每服一二錢水煎五味異功散治脾胃虛弱吐瀉不食人參茯苓白朮甘草炒陳皮各等分上為末每服三錢薑棗水煎益黃散治脾土虛寒嘔吐泄瀉陳皮青皮下食入太陰之倉丁香各二錢去脾胃中寒訶子肉五錢能開胃消食止痢甘草炙三錢上為末每服一二錢水煎瀉白散治肺經實熱咳嗽痰喘桑根白皮炒瀉肺氣之有餘有餘者邪有餘也地骨皮各一兩甘草炙五錢上為末每服一二錢入粳米百粒水煎阿膠散治肺虛咳嗽口乾作渴明阿膠一兩麩炒能補氣不足甘草炙一錢馬兜鈴五錢主肺熱咳嗽清肺補肺糯米一兩杏仁七粒去皮尖下喘用治氣也鼠黏子二錢五分上為末每服二錢水煎地黃丸治腎虛解顱或行遲語遲等症熟地黃八錢酒洗益腎水真陰補血虛山茱萸肉補腎添精乾山藥涼腎瀉陰中之火治足少陰無汗之骨蒸白茯苓各三錢入壬癸牡丹皮澤瀉各三錢上地黃杵膏余為末加煉蜜丸如桐子大每服二三十丸空心白湯送下四君子湯治脾氣虛弱飲食不化腸鳴泄瀉或嘔噦吐逆人參白茯苓白朮甘草炙各五分水煎服四物湯治肝經血虛發熱日晡益甚或煩躁不寐當歸熟地黃各二錢白芍藥一錢芎藭五分上作二劑水煎服八珍湯治氣血俱虛或因失血過多或因克伐元氣以致內熱發熱肢體瘦瘁即四物四君子二湯合服十全大補湯治氣血虛熱或因病後惡寒發熱或自汗盜汗食少體倦或發熱作渴頭痛眩暈等症即八珍湯加黃耆肉桂六君子湯治脾胃虛弱體瘦面黃或久患瘧痢不思乳食或嘔吐泄瀉飲食不化或時患飲食停滯或母有前症致兒為患人參白朮茯苓各二錢陳皮半夏甘草炙各一錢上每服二三錢薑棗水煎補中益氣湯治中氣不足困睡發熱或元氣虛弱感冒風寒諸症或乳母勞役發熱致兒為患黃耆炙人參白朮炒甘草炙當歸陳皮各五分升麻柴胡各二分上八味加薑棗水煎香砂助胃膏治胃寒吐瀉乳食不化人參白朮炒白茯苓各五錢甘草炙丁香各一錢去胃中寒砂仁四十粒下氣消食白豆蔻十四粒寬胃暖脾胃進食肉豆蔻四個煨溫中補脾下氣運化非比香附陳皮之駃泄也乾山藥一兩上為末煉蜜丸芡實大每服二三丸米飲磨化肥兒丸治食積五疳頸項結核發稀成穗發熱作渴等症黃連炒神麯炒木香各一兩五錢檳榔二十個破滯氣肉豆蔻二兩泡使君子酒浸麥芽炒各四兩上為末麵糊丸如麻子大每服三五十丸米飲下良久用五味異功散一服以助胃氣九味蘆薈丸治肝脾疳積體瘦熱渴大便不利或瘰癧結核耳內生瘡等症蘆薈胡黃連黃連木香蕪荑炒青皮白雷丸鶴蝨草各一兩麝香三錢上為末蒸餅糊丸如麻子大每服一二錢空心白湯下木香丸治冷疳木香青黛檳榔肉豆蔻麝香各一錢半續隨子一兩去油蛤蟆三個燒存性上為末蜜丸如緑豆大每服三五丸煎薄荷湯下胡黃連丸治熱疳胡黃連黃連各五錢硃砂二錢另研上為末填入豬膽內以線扎懸挂銚中淡漿水煮數沸取出研入蘆薈麝香各二錢飯和丸如麻子大每服一二十丸米飲下如聖丸治冷熱疳瀉使君子取肉一兩胡黃連川黃連白蕪荑炒各二兩五錢麝香五分另研干蛤蟆五個酒煮杵膏上為末以蛤蟆膏杵丸麻子大每服一二十丸煎人參湯下蘭香散治鼻疳赤爛蘭香葉二錢燒灰銅青輕粉各五分為末干貼白粉散治諸疳瘡海螵蛸三分白及二分輕粉一分上為末先用漿水洗拭乾貼蟾蜍丸治無辜疳症一服虛熱退二服煩渴止三服瀉痢愈蟾蜍一枚夏月溝渠中取腹大不跳不鳴身多癗者上取糞蛆一杓置桶中以尿浸之卻將蟾蜍跌死投與蛆食一晝夜用布袋盛蛆置急流中一宿取出瓦上焙乾為末入麝香一字粳米飯丸麻子大每服二三十丸米飲下其效如神蕪荑散治蟲動口內流涎白蕪荑乾漆炒各等分上為末每服五六分米飲下安蟲散治蟲動心痛胡粉炒黃檳榔川楝子鶴蝨各三錢枯白礬二錢五分上為末每服五六分痛時米飲調下白玉散治丹瘤白土二錢五分寒水石五錢為末用米醋或新水調塗柳華散治熱毒口瘡黃柏炒蒲黃青黛人中白煅各等分為末敷仙方活命飲治一切瘡毒未成內消已成即潰此消毒排膿止痛之聖藥也若膿出而腫痛不止者元氣虛也當補之穿山甲白芷防風沒藥甘草赤芍藥歸尾乳香花粉貝母各一錢金銀花陳皮各三錢皂角刺二錢上每服二三錢酒水各半煎消積丸治食積大便酸臭發熱丁香九粒縮砂十二粒巴豆二粒去皮心膜烏梅肉三個上為末麵糊丸黍米大每服五七丸溫水下保和丸治食積山楂二兩神麯二兩半夏茯苓各一兩陳皮連翹蘿蔔子各五錢上為末粥糊丸如桐子大每服一二十丸白湯下四神丸治脾腎稟虛泄瀉不食或乳母患此致兒為患肉豆蔻二兩補骨脂四兩五味子二兩吳茱萸一兩上為末用水二碗生薑八兩紅棗一百枚煮熟用棗肉和末丸如麻子大每服二三十丸空心食前白湯下子母並服五苓散治霍亂吐瀉燥渴飲水小便不利澤瀉五錢豬苓官桂赤茯苓白朮各三錢上為末每服一二錢白湯調下白虎湯治傷暑煩躁身熱痰盛頭痛口燥大渴知母一兩五錢石膏四兩白粳米八錢甘草炙五錢上為末每服一二錢水煎地黃清肺飲治肺疳咳嗽痰唾稠黏阿膠一錢麵炒鼠黏子二分炒馬兜鈴甘草各五分炙杏仁七枚去皮尖糯米十粒炒上每服一錢水煎此方似脫地黃一味否則即前阿膠散方矣參蘇飲治感冒風寒或腹脹少食泄瀉嘔吐或手足並冷喘促痰涎人參紫蘇陳皮半夏茯苓枳殼麩炒桔梗炒前胡乾葛甘草炒各五分木香三分為末每服一二錢水煎小柴胡湯治傷寒溫熱患身熱惡風頭痛項強四肢煩疼寒熱往來嘔吐痰實及治中暑病瘧柴胡八錢半夏湯泡黃芩人參各三錢甘草炙二錢上每服一二錢薑棗水煎加味逍遙散治乳母肝脾氣血虛弱發熱致兒為患當歸白朮茯苓芍藥炒黃各一錢柴胡牡丹皮山梔炒甘草炒各五分水煎服龍膽瀉肝湯治肝經濕熱或囊癰便毒小便澀滯龍膽草酒炒五分車前子炒木通歸尾澤瀉甘草黃芩生地山梔各三分水煎服茵陳湯治身熱鼻乾汗出二便赤澀濕熱發黃茵陳六錢梔子二個大黃二錢每服一錢水煎黃連香薷飲香薷四兩厚朴二兩黃連上每服一二錢將朴連同生薑炒令紫色入香薷水酒各一盞煎冷服金匱加減腎氣丸治脾腎虛腰重腳輕小便不利或肚腹腫脹四肢浮腫喘急痰盛已成蠱者此症多因脾胃虛弱治失其宜元氣復傷而變者非此藥不救白茯苓三兩附子泡五錢川牛膝肉桂澤瀉車前子山萸肉山藥牡丹皮各一兩熟地黃四兩掐碎酒拌杵膏上為末和地黃膏加煉蜜杵丸如桐子大每服一二十丸空心米湯下五色丸治五癇硃砂真珠各五錢水銀雄黃各一錢黑鉛三兩同水銀結成砂上為末煉蜜丸麻子大每服三四丸煎銀花薄荷湯下斷癇丹治癇瘥後變症不止黃耆蜜炙鉤藤鉤細辛甘草炙各五錢蛇退三寸酒炙蟬蛻去土四個牛黃一字另研上為末煮棗肉為丸麻子大每服五七丸人參煎湯下褊銀丸治風涎膈熱及乳食不消腹脹喘促巴豆水銀各五錢京墨八錢火燒醋淬研黑鉛二錢半水銀煎麝香五分另研上為末陳米粥丸如緑豆大每服二三丸煎薄荷湯下利驚丸治急驚天竺黃二錢輕粉青黛各一錢黑牽牛炒五錢上為末蜜丸碗豆大每歲服一丸薄荷湯化下小續命湯治中風不省人事涎鳴失音肢體反張或時厥冷麻黃去節人參黃芩芎藭芍藥甘草炒杏仁去皮尖研漢防己官桂各五錢防風七錢五分附子泡去皮臍二錢上各另為末和勻每服一錢薑棗水煎有熱減桂附鉤藤鉤飲治吐利脾胃虧損虛風慢驚鉤藤鉤三分蟬蛻防風炒人參麻黃白殭蠶炒天麻蠍尾去毒炒各五錢甘草炙芎藭各二錢五分麝香一錢另研為末每服一二錢水煎大青膏治傷風吐瀉身溫氣熱驚搐天麻青黛各一錢白附子乾蠍去毒烏梢蛇肉酒浸焙硃砂天竺黃二錢麝香二分上為末生蜜和膏每服一豆粒許月中兒用半粒薄荷湯化下百祥丸治痘瘡黑陷及嗽而吐青緑水紅芽大戟陰乾漿水煮軟去骨復入原汁中煮上焙乾為末水丸粟米大每服十丸赤芝麻湯送下牛李膏治痘瘡黑陷牛李子一味杵汁石器內熬膏每服皂子大煎杏膠湯化下雄黃散治痘後牙齦生疳蝕瘡雄黃一錢銅緑二錢同研細量瘡大小干糝其上歸脾湯治乳母脾經氣鬱致兒為患人參白朮茯神黃耆龍眼肉各二錢遠志一錢酸棗仁木香甘草炙三分上薑棗水煎服加柴胡山梔名加味歸脾湯越鞠丸治乳母六郁傳兒為患或胸滿吐酸齒痛瘡疥等症蒼朮神麯炒香附子山楂山梔炒芎藭麥芽炒各等分上為末水調神麯糊丸桐子大每服二三十丸白滾湯下子母並服安神丸治邪熱驚啼心肝壯熱面黃頰赤麥門冬去心焙牙硝白茯苓乾山藥寒水石甘草各五錢硃砂一兩龍腦二分半上為末煉蜜丸芡實大每服半丸砂糖水化下花火膏治夜啼燈花一顆塗乳上令兒吮之蟬蛻鉤藤散治肚疼驚啼鉤藤天麻茯苓芎藭白芍藥各二錢甘草蟬蛻各一錢每服一錢燈心湯下羚羊角丸治行遲羚羊角鎊虎脛骨醋炙黃生地黃焙酸棗仁白茯苓各五錢肉桂防風當歸黃耆各二錢五分上為末煉蜜丸每服一皂子大白湯化下止汗散治睡而自汗故蒲扇一把燒存性研為末每服三錢溫酒調下當歸六黃湯治血虛不足虛火內動盜汗不止當歸熟地黃黃耆炒黃柏以下俱炒黑黃芩黃連生地黃各等分每服二錢水煎服團參湯治心血虛熱自汗盜汗人參當歸各等分上用豬心一片每服三錢水煎服參附湯治稟賦不足上氣喘急自汗盜汗或病久陽氣脫陷急宜服之人參五錢附子泡一兩每服一錢薑水煎人參養榮湯治脾肺俱虛發熱惡寒肢體瘦倦食少作瀉或久病虛損口乾食少咳而下痢驚熱自汗白芍藥一錢五分人參陳皮黃耆蜜炙桂心當歸白朮炒甘草炙各一錢熟地黃五味子杵炒各七分遠志五分每服二三錢薑棗水煎浴體法治胎肥胎熱胎怯烏蛇肉酒浸焙白礬青黛各三錢天麻二錢蠍尾去毒硃砂各五分麝香二分半上為末桃枝一握水煎浴之勿浴背神效當歸膏治跌撲湯火等瘡不問已潰未潰當歸黃蠟生地黃各一兩麻油六兩上先將當歸地黃入油煎黑去渣入蠟熔化候冷攪勻即成膏矣以上皆直訣所載之方以下諸方皆取別本附入者保命散祕方治一切急驚慢驚痰涎湧塞手足抽搐目直神昏夜啼晝倦吐乳瀉白種種惡症珍珠牛黃各三分琥珀五分膽星白附子蟬蛻炙天蟲茯苓皂角防風茯神各二錢天竺黃研橘紅甘草薄荷硃砂各一錢天麻三錢全蠍十個酒洗焙礞石三錢煅冰片麝香各三分上為末和勻每服一二分或用神麯糊丸麻子大每服一二十丸量兒大小加減鉤藤一錢薄荷三分泡湯下凡小兒有病即宜少與乳食若似驚風即宜斷乳如欲食與米飲一勺必欲食乳須先將乳擠空然後以空乳令吮否則乳下喉中即成頑痰雖神丹無效俟少安漸與乳可也治疳積方不落水雞肝酒洗同黃蠟一錢頓熟去蠟吃治赤痏方寒水石黃柏黃連大黃鉛粉枯礬白墡粉冰片青黛上藥隨舉幾味研麻油調塗治痘出眼中方取田雞膽點之愈治癩方不拘頭面遍身痛癢黃水出俱效黃連一兩蛇床子五錢五倍子一兩輕粉三錢黃柏五錢枯礬五錢川椒二錢冰片一錢同研麻油調塗治骨蒸方銀柴胡八分鮮骨皮一錢酒洗真青蒿八分川連五分犀角五分丹皮五分甘草三分元參一錢竹葉二十片蘆根一兩水煎服治遺尿方幼幼新書雞䏶胵一具炙桑螵蛸三枚炒甘草三分炙黃耆牡蠣各五錢煅為粗末每用一錢水一盞煎去渣服治牙疳方人中白一錢枯礬三分紅褐子一錢燒存性雞肫皮二錢煅霜梅八分煅雄黃五分硼砂五分銅青三分上為末煎濃茶調搽吐出涎治吐乳方幼幼新書蓮子心七枚焙丁香三粒人參三分上同研乳汁浸令兒吮食治螳螂子方即妬乳也青黛一錢元明粉三錢硼砂一錢薄荷五分冰片一分上同研細擦口內兩頤吐出涎一日用四五次自古無螳螂子之病凡小兒變蒸之候每有口內微腫惡乳之時名曰妬乳不治自愈其或不能坐視則用此方塗口亦易愈近日海濱妖婦造割螳螂子之法以騙人取利強者幸愈弱者俱死惟松江蘇州最受其害蓋小兒兩頤內外皮有兩層中空處有脂膜一塊人人皆然割去復生妖婦以此惑人人見果有如螳螂子者遂相信不疑死而不悔深可憐憫除蘇松之外天下並無有生螳螂子而死者斷不可為其所愚而受害也損小兒股內無力因跌而起一足不伸臀左右大小不同腰脊歪斜脊骨高起俱屬不治或久而成毒亦為廢人
